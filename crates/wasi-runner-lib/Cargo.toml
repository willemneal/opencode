[package]
name = "wasi-runner"
version = "0.1.0"
edition = "2024"
description = "WASI runner library for OpenCode sandboxed tools"

[dependencies]
wasmtime = "29"
wasmtime-wasi = "29"
wasmtime-wasi-http = "29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
tempfile = "3"
wasi-tool-error = { path = "../wasi-tool-error" }
http-body-util = "0.1"
hyper = "1.6"
tokio = { version = "1", features = ["rt", "net"] }
