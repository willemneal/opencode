[package]
name = "opencode-wasi-runner"
version = "0.1.0"
edition = "2024"
description = "WASI runner for OpenCode sandboxed tools"

[[bin]]
name = "wasi-runner"
path = "src/main.rs"

[dependencies]
wasmtime = "29"
wasmtime-wasi = "29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
tempfile = "3"
wasi-tool-error = { path = "../wasi-tool-error" }

[dev-dependencies]
serde_json = "1"
