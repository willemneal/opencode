[package]
name = "opencode-wasi-runner"
version = "0.1.0"
edition = "2024"
description = "WASI runner CLI for OpenCode sandboxed tools"

[[bin]]
name = "wasi-runner"
path = "src/main.rs"

[dependencies]
wasi-runner = { path = "../wasi-runner-lib" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
serde_json = "1"
wasi-runner = { path = "../wasi-runner-lib" }
